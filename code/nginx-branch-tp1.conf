# Nginx cua chi nhanh TP1 (mount vao /etc/nginx/conf.d/default.conf cua image erp-frontend).
# Phuc vu SPA cho STAFF tai chi nhanh va dinh tuyen API:
#   - Dang nhap/refresh, quan tri (branches, analytics, admin) -> HQ
#   - GHI master data (catalog/customers/suppliers: POST/PUT/PATCH/DELETE) -> HQ
#   - DOC master data (da replicate xuong branch) + moi API giao dich -> Branch TP1
# Xem docs/audit/sales-invoice-create-bug-report.md (BUG-2).

upstream hq_backend {
    server hq-app:8080;
}

upstream branch_backend {
    server branch-tp1-app:8080;
}

map $request_method $master_data_backend {
    GET     branch_backend;
    HEAD    branch_backend;
    default hq_backend;
}

server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;

    # Whitelist IP chi nhanh TP1
    allow 192.168.1.0/24;  # Dai IP noi bo branch TP1
    allow 10.0.0.0/8;       # VPN
    allow 172.16.0.0/12;    # Docker bridge (moi truong dev) - xoa khi trien khai that
    allow 127.0.0.1;
    deny all;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/auth/ {
        proxy_pass http://hq_backend;
    }

    location ~ ^/api/v1/(branches|analytics|admin)(/|$) {
        proxy_pass http://hq_backend;
    }

    location ~ ^/api/v1/(catalog|customers|suppliers)(/|$) {
        proxy_pass http://$master_data_backend;
    }

    # Mac dinh: API giao dich (sales-invoices, goods-returns, inventory, stock-movements,
    # receivable-debts, customer-prices...) -> Branch
    location /api/ {
        proxy_pass http://branch_backend;
    }
}
