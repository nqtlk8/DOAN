# LUU Y: file mau cu, KHONG DUOC docker-compose su dung.
# Cau hinh dang dung: nginx-branch-tp1.conf / nginx-branch-tp2.conf
# (phuc vu SPA + dinh tuyen auth/master -> HQ, giao dich -> Branch).
events {}
http {
    server {
        listen 80;
        server_name localhost;
        client_max_body_size 50M;

        # Whitelist IP chi nhanh
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 127.0.0.1;
        deny all;

        location / {
            proxy_pass http://branch-tp1-app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
