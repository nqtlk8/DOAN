# ============================================================================
# Danh sách bảng replicate — NGUỒN DUY NHẤT cho scripts/setup-replication.sh.
# Khi thêm/bớt bảng ở đây, phải cập nhật cùng lúc:
#   - docs/architecture/DATA_OWNERSHIP_MATRIX.md
#   - db/migration-branch/R__branch_db_security.sql (danh sách bảng chi nhánh được ghi)
# rồi chạy lại scripts/setup-replication.sh <chi nhánh> cho từng chi nhánh (script tự
# ALTER PUBLICATION ... SET TABLE và REFRESH subscription).
# ============================================================================

# HQ -> mọi chi nhánh (publication pub_hq_master ở HQ). HQ là nơi DUY NHẤT ghi các bảng này.
MASTER_TABLES=(
  branch role permission role_permission user_account user_branch_role
  category product supplier price_list
  customer
  inventory_alert_config
  dim_date
)

# Chi nhánh -> HQ (publication pub_<chi nhánh>_to_hq). Chỉ chi nhánh sở hữu ghi các bảng này.
TRANSACTION_TABLES=(
  sales_invoice sales_invoice_line
  goods_return goods_return_line
  inbound_receipt inbound_receipt_line
  stock_movement cost_layer
  receivable_debt_movement
)

# Chi nhánh -> HQ, có row filter WHERE (branch_id = <id chi nhánh>) — bảng snapshot số dư.
# Cần REPLICA IDENTITY gồm branch_id (db/migration/V8__replication_support.sql).
SNAPSHOT_TABLES=(
  stock_on_hand
  receivable_debt
)
