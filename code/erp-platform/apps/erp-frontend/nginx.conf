server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Frontend HQ (cong 80) danh cho ADMIN: moi API -> hq-app.
    # STAFF tao giao dich qua Nginx cua chi nhanh (code/nginx-branch-tpX.conf) de API
    # giao dich di ve dung Branch. HQ chay instance.role=HQ nen tra 404 cho API giao dich.
    location /api/ {
        proxy_pass http://hq-app:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}