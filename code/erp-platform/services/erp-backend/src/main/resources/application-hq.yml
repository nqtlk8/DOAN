instance:
  # HQ chi quan ly master data + cap JWT. Controller giao dich (sales-invoices,
  # goods-returns, inventory/inbound) chi bat o BRANCH -> HQ tra 404 neu bi goi nham.
  # (Profile 'local' van dung ALL cho dev 1 process.)
  role: HQ

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/erp_hq}
    username: ${SPRING_DATASOURCE_USERNAME:app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:app_password}
  flyway:
    enabled: true
    # Flyway chạy bằng user sở hữu bảng (tạo schema); app chạy bằng SPRING_DATASOURCE_USERNAME (erp_app).
    user: ${SPRING_FLYWAY_USER:erp_user}
    password: ${SPRING_FLYWAY_PASSWORD:erp_password}
    # db/migration: schema chung (giống hệt ở mọi instance)
    # db/migration-hq: dữ liệu hệ thống chỉ chèn ở HQ rồi replicate xuống chi nhánh
    locations: classpath:db/migration,classpath:db/migration-hq
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  private-key: ${JWT_PRIVATE_KEY_PATH:classpath:certs/private_key.pem}
  public-key: ${JWT_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}
  expiration-ms: 1800000 # 30 minutes
