spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
instance:
  role: ALL

jwt:
  # Khoa doc tu thu muc code/secrets (da gitignore), tao bang scripts/generate-jwt-keys.sh.
  private-key: ${JWT_PRIVATE_KEY_PATH:file:../../../secrets/private_key.pem}
  public-key: ${JWT_PUBLIC_KEY_PATH:file:../../../secrets/public_key.pem}
  expiration-ms: 1800000
  refresh-expiration-ms: 604800000
