instance:
  role: BRANCH
  branch-id: ${BRANCH_ID:HCM01}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/erp_branch_hcm01}
    username: ${SPRING_DATASOURCE_USERNAME:app_user}
    password: ${SPRING_DATASOURCE_PASSWORD:app_password}
  flyway:
    user: ${SPRING_FLYWAY_USER:erp_user}
    password: ${SPRING_FLYWAY_PASSWORD:erp_password}
    locations: classpath:db/migration,classpath:db/migration-branch
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

# NOTE: No Redis config here. Branch uses Caffeine in-memory if caching is needed.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

jwt:
  public-key: ${JWT_PUBLIC_KEY_PATH:classpath:certs/public_key.pem}
  # Branch only verifies JWT using public key, NO private key used.
