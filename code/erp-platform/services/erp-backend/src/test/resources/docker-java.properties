# Phiên bản Docker Engine API mà Testcontainers (docker-java đóng gói sẵn) dùng khi chạy test.
# Testcontainers 1.20.x mặc định ép API 1.32 khi không cấu hình; Docker Desktop / Docker Engine 29+
# từ chối mọi client cũ hơn 1.40-1.44 ("client version 1.32 is too old"). 1.44 được Docker Engine 25+ hỗ trợ.
# Ghi đè khi cần: biến môi trường DOCKER_API_VERSION hoặc -Dapi.version=... (ưu tiên cao hơn file này).
api.version=1.44
