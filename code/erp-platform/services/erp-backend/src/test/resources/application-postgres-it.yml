spring:
  datasource:
    url: ${testcontainers.jdbc.url}
    username: ${testcontainers.jdbc.username}
    password: ${testcontainers.jdbc.password}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
